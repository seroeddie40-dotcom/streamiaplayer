name: streamia_player
description: Streamia Player - Premium IPTV for Android TV
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  media_kit: ^1.1.10
  media_kit_video: 1.2.4  # WICHTIG: Auf diese Version festgelegt für Flutter 3.24.0
  media_kit_libs_video: ^1.0.4
  http: ^1.1.0
  xml: ^6.5.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  dio: ^5.4.0
  wakelock_plus: 1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  package_info_plus: 8.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/images/
